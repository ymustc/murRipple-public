<svg viewBox="0 0 900 470" width="100%" style="max-width:900px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">The murRipple pipeline, in four steps</title>
<desc id="pipeline-desc">Audio plus lyrics go in. Step one separates the audio into stems with Demucs and analyses beats, pitch and energy. Step two aligns the lyrics to time with WhisperX; it is optional and any degradation is announced. Step three writes build/timeline.json, the one file that holds all the truth. Step four inlines the audio, the renderer and the timeline into one self-contained dist/index.html, which can also be rendered frame by frame into a 1080p60 MP4.</desc>

<!--
  语言中立：图上只有文件名、工具名与 STEP 1..4，三份 README（英/中/法）共用
  这一张。说明文字在 <desc> 里（英文，给读屏器）。

  自带浅色底：GitHub 有深浅两套主题，`currentColor` 能跟着走但只能是黑白的。
  带上自己的底色之后，两种主题下看到的是同一张图。

  配色取自 `murripple/lanes.py` 的声部色相，没有临场发明的颜色：
  碎玉 195 · 泠泠 165 · 霜铎 60 · 撼岳 28 · 渊鸣 225 · 缥缈 270
-->

<style>
  .bg    { fill:#f4f7fb }
  .card  { fill:#ffffff; stroke:#dde5ee; stroke-width:1 }
  .io    { fill:#eef3f9; stroke:#d3dde9; stroke-width:1 }
  .n     { font:700 10.5px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em }
  .h     { font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#16232f }
  .s     { font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#5b6b7c }
  .m     { font:400 11.5px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#3d5163 }
  .mb    { font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#16232f }
  .arr   { stroke:#9fb2c4; stroke-width:1.7; fill:none; marker-end:url(#a) }
  .note  { font:italic 400 11px system-ui,sans-serif; fill:#7d8fa1 }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#9fb2c4"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="900" height="470" rx="14"/>

<!-- ── 输入 ───────────────────────────────────────────────── -->
<rect class="io" x="28" y="176" width="132" height="80" rx="9"/>
<text class="mb" x="46" y="207">source.mp3</text>
<text class="m"  x="46" y="228">lyrics.txt</text>
<text class="s"  x="46" y="246">↳ optional</text>
<path class="arr" d="M166 216 H 200"/>

<!-- ── STEP 1 · 分析（碎玉 195）──────────────────────────── -->
<rect class="card" x="204" y="60" width="150" height="150" rx="10"/>
<rect x="204" y="60" width="150" height="4" rx="2" fill="hsl(195 92% 45%)"/>
<text class="n" x="222" y="88" fill="hsl(195 92% 34%)">STEP 1</text>
<text class="h" x="222" y="110">analyse</text>
<text class="s" x="222" y="132">Demucs → stems</text>
<text class="s" x="222" y="150">beats · pitch</text>
<text class="s" x="222" y="168">energy envelope</text>
<text class="m" x="222" y="192">4 stems</text>

<!-- ── STEP 2 · 对齐（泠泠 165）──────────────────────────── -->
<rect class="card" x="204" y="248" width="150" height="150" rx="10"/>
<rect x="204" y="248" width="150" height="4" rx="2" fill="hsl(165 72% 38%)"/>
<text class="n" x="222" y="276" fill="hsl(165 72% 30%)">STEP 2</text>
<text class="h" x="222" y="298">align</text>
<text class="s" x="222" y="320">WhisperX</text>
<text class="s" x="222" y="338">language: detected</text>
<text class="s" x="222" y="356">optional</text>
<text class="note" x="222" y="380">degrades loudly</text>

<path class="arr" d="M360 135 H 400 V 216 H 430"/>
<path class="arr" d="M360 323 H 400 V 216 H 430"/>

<!-- ── STEP 3 · 时间线（霜铎 60）─────────────────────────── -->
<rect class="card" x="434" y="154" width="150" height="124" rx="10"/>
<rect x="434" y="154" width="150" height="4" rx="2" fill="hsl(60 78% 40%)"/>
<text class="n" x="452" y="182" fill="hsl(38 78% 33%)">STEP 3</text>
<text class="h" x="452" y="204">timeline</text>
<text class="mb" x="452" y="228">build/</text>
<text class="mb" x="452" y="245">timeline.json</text>
<text class="s" x="452" y="264">one file, all the truth</text>

<path class="arr" d="M590 216 H 626"/>

<!-- ── STEP 4 · 打包（撼岳 28）───────────────────────────── -->
<rect class="card" x="630" y="154" width="150" height="124" rx="10"/>
<rect x="630" y="154" width="150" height="4" rx="2" fill="hsl(28 88% 50%)"/>
<text class="n" x="648" y="182" fill="hsl(28 88% 38%)">STEP 4</text>
<text class="h" x="648" y="204">pack</text>
<text class="s" x="648" y="226">audio + renderer</text>
<text class="s" x="648" y="244">+ timeline</text>
<text class="s" x="648" y="262">inlined, base64</text>

<path class="arr" d="M786 200 H 812 V 118 H 838" />
<path class="arr" d="M786 236 H 812 V 330 H 838" />

<!-- ── 两个产物（渊鸣 225 / 缥缈 270）────────────────────── -->
<rect class="io" x="620" y="66" width="252" height="66" rx="9"/>
<rect x="620" y="66" width="4" height="66" rx="2" fill="hsl(225 80% 55%)"/>
<text class="mb" x="640" y="94">dist/index.html</text>
<text class="s"  x="640" y="115">one file · open it anywhere · offline</text>

<rect class="io" x="620" y="300" width="252" height="66" rx="9"/>
<rect x="620" y="300" width="4" height="66" rx="2" fill="hsl(270 70% 60%)"/>
<text class="mb" x="640" y="328">dist/&lt;song&gt;.mp4</text>
<text class="s"  x="640" y="349">1080p60 · rendered frame by frame</text>

<!-- ── 底注 ───────────────────────────────────────────────── -->
<path d="M28 416 H 872" stroke="#dde5ee" stroke-width="1"/>
<text class="s" x="28" y="440">Every step checks whether its output already exists and skips itself if so.</text>
<text class="s" x="28" y="458">Nothing leaves your machine — no model-provider API is called at any step.</text>
</svg>
