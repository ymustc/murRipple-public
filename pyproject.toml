[project]
name = "murripple"
version = "0.1.0"
description = "murRipple — weave a song into ripples you can see"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The upper bound is not caution. Installing rapidocr drags numpy up to 2.x,
    # while librosa/demucs and friends are still built against the 1.x ABI —
    # once numpy moves, the whole analysis chain stops working.
    "numpy>=1.26,<2",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "jsonschema>=4.21",
    "demucs>=4.0.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
align = [
    "whisperx>=3.1",
    # torchaudio must match torch exactly or the ABI mismatch makes the dlopen
    # fail at import time. demucs + pyannote-audio resolve torch to 2.2.2, so
    # torchaudio is pinned to the same version.
    "torchaudio==2.2.2",
    # transformers 5.x requires torch>=2.5, which conflicts with the 2.2.2 above;
    # transformers then falls back to "no torch" mode and whisperx raises
    # NameError from inside. And 4.52+ refuses to torch.load .bin weights when
    # torch<2.6 (CVE-2025-32434) — the Chinese alignment model ships as .bin, so
    # that path reports "model not found". 4.48.3 is the version measured to work.
    "transformers==4.48.3",
    # transformers 4.48 requires huggingface-hub<1.0.
    "huggingface-hub<1",
    # Traditional-to-simplified Chinese conversion. Whisper emits traditional
    # characters for some passages of a Chinese song; character-level comparison
    # treats traditional and simplified as different characters, so those lines
    # would all miss. Pure Python, no native dependency.
    "opencc-python-reimplemented>=0.1.7",
]

ocr = [
    # Reading subtitles burned into the picture. Most songs never need it — a
    # song that already has lyrics.txt never reaches this path — so like align
    # it lives in an optional extra rather than costing everyone the download.
    # rapidocr rather than PaddleOCR: same PP-OCR model family, but it only
    # needs onnxruntime, which installs cleanly on macOS ARM + py3.11.
    "rapidocr-onnxruntime>=1.4",
]

[project.scripts]
murripple = "murripple.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["murripple"]
